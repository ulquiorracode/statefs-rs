[package]
name = "statefs-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Modern, decoupled hierarchical configuration management engine powered by StateFS"
keywords = ["config", "manager", "ports", "validation", "capabilities"]
categories = ["config"]

[features]
default = ["toml", "env", "serde"]
toml = ["statefs-codec-toml"]
json = ["statefs-codec-json"]
env = ["statefs-adapter-bridge-env"]
serde = ["dep:serde", "statefs-adapter-bridge-serde"]

[dependencies]
statefs-core = { path = "../../core/statefs-core" }
statefs-codec-toml = { path = "../../codecs/statefs-codec-toml", optional = true }
statefs-codec-json = { path = "../../codecs/statefs-codec-json", optional = true }
statefs-adapter-bridge-env = { path = "../../adapters/bridge/statefs-adapter-bridge-env", optional = true }
statefs-adapter-bridge-serde = { path = "../../adapters/bridge/statefs-adapter-bridge-serde", optional = true }
serde = { version = "1.0", default-features = false, optional = true }
